version: '3.8'

services:
  # =================================================================
  # 1. Apache Zookeeper (Distributed Coordinator for Kafka)
  # =================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: logmonito-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - logmonito-net

  # =================================================================
  # 2. Apache Kafka (Message Streaming Buffer for Telemetry)
  # =================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: logmonito-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - logmonito-net

  # =================================================================
  # 3. Auth Service (User Login, Register & SDK Key Management)
  # =================================================================
  auth-service:
    build:
      context: ./Backend Application/AuthServiceMon
      dockerfile: Dockerfile
    container_name: logmonito-auth-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://host.docker.internal:27017/ai_monitoring_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - logmonito-net

  # =================================================================
  # 4. Ingestion Service (High-Throughput Telemetry Receiver)
  # =================================================================
  ingestion-service:
    build:
      context: ./Backend Application/IngestionService
      dockerfile: Dockerfile
    container_name: logmonito-ingestion-service
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - logmonito-net

  # =================================================================
  # 5. Storage Service (Kafka Consumer -> MongoDB Persister)
  # =================================================================
  storage-service:
    build:
      context: ./Backend Application/StorageService
      dockerfile: Dockerfile
    container_name: logmonito-storage-service
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://host.docker.internal:27017/ai_monitoring_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - logmonito-net

  # =================================================================
  # 6. Analyzer Service (Dashboard API & Local Ollama AI Diagnostics)
  # =================================================================
  analyzer-service:
    build:
      context: ./Backend Application/AnalyzerService
      dockerfile: Dockerfile
    container_name: logmonito-analyzer-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://host.docker.internal:27017/ai_monitoring_db
      - AI_DEBUGGER_URL=http://host.docker.internal:8000/diagnose
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - logmonito-net

  # =================================================================
  # 7. API Gateway (Edge Routing, JWT Auth, API Key Validation)
  # =================================================================
  api-gateway:
    build:
      context: ./Backend Application/ApiGatewayMonitor
      dockerfile: Dockerfile
    container_name: logmonito-api-gateway
    depends_on:
      - auth-service
      - ingestion-service
      - analyzer-service
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8082
      - INGESTION_SERVICE_URL=http://ingestion-service:8081
      - DASHBOARD_SERVICE_URL=http://analyzer-service:8084
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - logmonito-net

  # =================================================================
  # 8. Frontend Application (React Dashboard)
  # =================================================================
  #frontend:
   # build:
    #  context: ./frontend
     # dockerfile: Dockerfile
    #container_name: logmonito-frontend
    #depends_on:
     # - api-gateway
    #ports:
   #   - "5173:5173"
   # networks:
    #  - logmonito-net

networks:
  logmonito-net:
    driver: bridge
