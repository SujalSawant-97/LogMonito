name: LogMonito CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =================================================================
  # 1. Java Quality Gate: Build & Test Microservices & Custom SDK
  # =================================================================
  java-build-and-test:
    name: Build & Test Java Microservices (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Install Custom Starter SDK to Local Maven Repo
        run: |
          cd "Custom SDK/monitor-spring-boot-starter"
          mvn clean install -B -DskipTests

      - name: Build & Test AuthServiceMon
        run: |
          cd "Backend Application/AuthServiceMon"
          mvn clean test -B

      - name: Build & Test IngestionService
        run: |
          cd "Backend Application/IngestionService"
          mvn clean test -B

      - name: Build & Test StorageService
        run: |
          cd "Backend Application/StorageService"
          mvn clean test -B

      - name: Build & Test AnalyzerService
        run: |
          cd "Backend Application/AnalyzerService"
          mvn clean test -B

      - name: Build & Test ApiGatewayMonitor
        run: |
          cd "Backend Application/ApiGatewayMonitor"
          mvn clean test -B

      - name: Build Demo Client
        run: |
          cd demo-client
          mvn clean package -B -DskipTests

  # =================================================================
  # 2. Python Quality Gate: Test AI Debugger & MCP Server
  # =================================================================
  python-test:
    name: Test AI Debugger & FastMCP (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd ai-debugger
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with Flake8
        run: |
          cd ai-debugger
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Verify Diagnostic Parser Execution
        run: |
          cd ai-debugger
          python test_diagnostics.py

  # =================================================================
  # 3. Frontend Quality Gate: React 18 + Vite Production Build
  # =================================================================
  frontend-build:
    name: Build & Verify React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Execute Vite Production Build
        run: |
          cd frontend
          npm run build

  # =================================================================
  # 4. Containerization & Orchestration Verification
  # =================================================================
  docker-validation:
    name: Validate Docker Compose Orchestration
    runs-on: ubuntu-latest
    needs: [java-build-and-test, python-test, frontend-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Microservice Docker Images
        run: docker compose build
