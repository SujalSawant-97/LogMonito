spring.application.name=storage-service

# Server Configuration (Headless worker, prevents port conflict if web starter is added)
server.port=8083
spring.main.web-application-type=none

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ai_monitoring_db}

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=storage-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Spring Kafka JSON Deserializer Trust & Type Mapping
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=com.example.IngestionService.dto.LogPayload:com.example.StorageService.dto.LogPayload,com.example.IngestionService.dto.MetricPayload:com.example.StorageService.dto.MetricPayload
